<style>
/* Define la arquitectura visual principal del menú lateral estilo cristal premium */
#menu {
    z-index: 10000;
}
#menu .inner {
    background: hsla(220, 15%, 4%, 0.6) !important;
    backdrop-filter: var(--blur-intensity) !important;
    -webkit-backdrop-filter: var(--blur-intensity) !important;
    border-left: 1px solid var(--glass-border) !important;
    box-shadow: -15px 0 50px rgba(0, 0, 0, 0.9) !important;
    padding: 4em 3em !important;
    max-width: 280px;
    display: flex;
    flex-direction: column;
    font-family: 'Outfit', sans-serif !important;
}

#menu .inner h2 {
    color: var(--brand-yellow) !important;
    font-size: 1.25em;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 2em;
    border-bottom: 2px solid var(--brand-red) !important;
    padding-bottom: 1em;
    text-shadow: 0 4px 15px rgba(0, 0, 0, 0.9);
    font-weight: 700;
}

#menu .inner .links {
    list-style: none;
    padding: 0;
    margin: 0;
    flex-grow: 1;
}

#menu .inner .links li {
    margin: 1.25em 0;
    border-top: none !important;
    padding: 0 !important;
}

#menu .inner .links li a {
    color: var(--brand-white) !important;
    font-size: 0.9em;
    font-weight: 300;
    text-decoration: none;
    display: block;
    padding: 0.5em 0;
    transition: all var(--transition-snappy);
    position: relative;
    overflow: visible;
    background: transparent;
    border: none;
    letter-spacing: 2px;
    text-transform: uppercase;
}

#menu .inner .links li a:hover {
    color: var(--brand-yellow) !important;
    transform: translateX(12px);
    font-weight: 600;
}

#menu .inner .links li a::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 0;
    width: 0;
    height: 1px;
    background-color: var(--brand-yellow);
    transition: width var(--transition-snappy);
}

#menu .inner .links li a:hover::after {
    width: 40px;
}

#menu .inner .close {
    background-image: none !important; 
    position: absolute;
    top: 2em;
    right: 2em;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: hsla(0, 0%, 100%, 0.05) !important;
    border-radius: 50%;
    color: rgba(255,255,255,0.6) !important;
    text-decoration: none;
    transition: all var(--transition-snappy);
    border: 1px solid hsla(0, 0%, 100%, 0.1) !important;
    font-size: 0.8em;
    text-indent: 0 !important;
    overflow: visible !important;
}

#menu .inner .close:hover {
    background: var(--brand-red) !important;
    transform: rotate(90deg) scale(1.1);
    color: white !important;
    border-color: var(--brand-red) !important;
    box-shadow: 0 0 20px hsla(0, 80%, 50%, 0.3);
}

/* Control de opacidad para enfoque visual */
#menu .inner .links li {
    transition: opacity var(--transition-snappy);
}
#menu .inner .links:hover li {
    opacity: 0.4;
}
#menu .inner .links li:hover {
    opacity: 1;
}
</style>

<nav id="menu">
    <div class="inner">
        <h2>Menú</h2>
        <ul class="links">
            <li><a href="/">Inicio</a></li>
            <li><a href="/nosotros">Nosotros</a></li>
            <li><a href="/petrolera">Petrolera</a></li>
            <li><a href="/agricola">Agrícola</a></li>
            <li><a href="/mineria">Minería</a></li>
            <li><a href="/energia">Energía</a></li>
            <li><a href="/construccion">Construcción</a></li>
            <li><a href="/contacto">Contacto</a></li>
        </ul>
        <a href="#" class="close" title="Cerrar">✕</a>
    </div>
</nav>
